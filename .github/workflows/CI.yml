name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-lint-test:
    runs-on: macos-latest
    strategy:
      matrix:
        swift-version: ["6.0", "6.3"]
    steps:
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.swift-version }}
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Lint
      if: matrix.swift-version == '6.3'
      run: brew install swiftlint && swiftlint lint --strict
    - name: Test
      run: swift test -v
