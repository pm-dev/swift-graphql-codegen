name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-lint-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Sources/GraphQLJS/pnpm-lock.yaml

      - name: Verify GraphQL JavaScript bundle
        run: |
          ./Scripts/update-graphql-bundle
          git diff --exit-code -- Sources/GraphQLCodegen/Resources/graphql.bundle.js

      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3"

      - uses: jdx/mise-action@v3

      - uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swift-6.3-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-6.3-

      - name: Build
        run: swift build --build-tests -v

      - name: Periphery
        run: mise run periphery -- --format github-actions --relative-results --color never

      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --strict

      - name: Test
        run: swift test --skip-build -v
