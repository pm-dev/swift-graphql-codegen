name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-lint-test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MISE_ENABLE_TOOLS: periphery,swiftlint

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: Sources/GraphQLJS/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Sources/GraphQLJS/pnpm-lock.yaml

      - name: Verify GraphQL JavaScript bundle
        run: |
          ./Scripts/update-graphql-bundle
          if ! git diff --quiet -- Sources/GraphQLCodegen/Resources/graphql.bundle.js; then
            echo "::error file=Sources/GraphQLCodegen/Resources/graphql.bundle.js::GraphQL JavaScript bundle is out of date. Run ./Scripts/update-graphql-bundle and commit the regenerated bundle."
            git diff --stat -- Sources/GraphQLCodegen/Resources/graphql.bundle.js
            exit 1
          fi

      - uses: jdx/mise-action@v4
        with:
          add_shims_to_path: false
          cache_key_prefix: mise-ci-v1

      - uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('mise.lock', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build
        run: swift build --build-tests

      - name: Periphery
        run: mise run periphery -- --format github-actions --relative-results --color never --quiet

      - name: Lint
        run: mise run lint

      - name: Test
        run: swift test --skip-build

  starwars-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: StarwarsExample/server

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: StarwarsExample/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check server
        run: npm run check

      - name: Verify registered operations
        run: git diff --exit-code -- src/registered-operations.generated.ts
