name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-lint-test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: "10.33.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Sources/GraphQLJS/pnpm-lock.yaml

      - name: Verify GraphQL JavaScript bundle
        run: |
          ./Scripts/update-graphql-bundle
          git diff --exit-code -- Sources/GraphQLCodegen/Resources/graphql.bundle.js

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('mise.lock', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build
        run: swift build --build-tests -v

      - name: Periphery
        run: mise run periphery -- --format github-actions --relative-results --color never

      - name: Lint
        run: mise run lint

      - name: Test
        run: swift test --skip-build -v
